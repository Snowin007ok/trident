<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TRIDENT — Learn the Past. Shape the Future.</title>
<meta name="description" content="TRIDENT is an interactive history-learning adventure built on verified Tamil Nadu State Board and CBSE textbook passages, with page-level citations.">
<meta name="theme-color" content="#FFF8E8">
<link rel="icon" href="assets/trident-logo.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<header class="app-header" id="appHeader" hidden>
  <div class="shell header-inner">
    <a class="brand" href="#/dashboard" aria-label="TRIDENT home">
      <img src="assets/trident-logo.png" alt="" class="brand-mark" width="38" height="38">
      <span class="brand-text">
        <strong>TRIDENT</strong>
        <em>Learn the past</em>
      </span>
    </a>

    <nav id="primaryNav" class="primary-nav" aria-label="Primary">
      <ul>
        <li><a href="#/dashboard" data-nav="home">Home</a></li>
        <li><a href="#/library" data-nav="learn">Learn</a></li>
        <li><a href="#/quiz" data-nav="practice">Practice</a></li>
        <li><a href="#/progress" data-nav="progress">Progress</a></li>
      </ul>
    </nav>

    <div class="hud" id="hud"></div>
  </div>
  <div class="tricolour-rule" id="navTricolour" data-testid="tricolour-nav" aria-hidden="true"><i></i><i></i><i></i></div>
</header>

<main id="main" class="shell" tabindex="-1">
  <div id="view"></div>
</main>

<footer class="app-footer" id="appFooter" hidden>
  <div class="shell">
    <p>Every lesson, question and story quotes a verified Tamil Nadu State Board or CBSE textbook and cites its page. Your progress is kept in this browser.</p>
  </div>
</footer>

<nav class="bottom-nav" id="bottomNav" aria-label="Primary, mobile" hidden>
  <ul id="bottomNavList"></ul>
</nav>

<div id="modalRoot"></div>
<div id="toast" class="toast" hidden></div>
<div id="liveRegion" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="js/app.js"></script>
<noscript>
  <p class="shell noscript">TRIDENT needs JavaScript enabled to run.</p>
</noscript>
</body>
</html>
